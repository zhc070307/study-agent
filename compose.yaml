name: study-agent
services:
  study:
    build: .
    # The adopted native modules target x86_64; Docker Desktop emulates on Apple Silicon.
    platform: linux/amd64
    ports:
      - "127.0.0.1:8765:8765"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - study_data:/data
      - ./.local-tools:/host-tools:ro
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  study_data:
