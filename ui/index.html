<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef5ff">
  <title>Study Agent · 学习桌</title>
  <link rel="stylesheet" href="lib/pdfjs/pdf_viewer.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="harness-sidebar.css">
  <script src="lib/marked.umd.js" defer></script>
  <script src="lib/purify.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-defs" aria-hidden="true"><defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m7 17 10-10M7 7h10v10"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m10 6-6 6 6 6M4 12h16"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h7l2 3h9v12H3Z"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16m4-11-2 3 2 3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5Zm9 0v6h5M9 13h6M9 17h6"/></symbol>
    <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></symbol>
    <symbol id="i-rename" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L20 8l-4-4L5 15Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
  </defs></svg>
  <header class="app-header">
    <a class="brand" href="#" id="home" aria-label="Study Agent，返回桌面"><span>Study Agent</span></a>
    <button id="semester-menu" class="text-button" title="查看或更换学期">学期</button>
    <button id="app-update" class="text-button" hidden>有新版本</button>
    <button id="settings" class="icon-button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="m9 3-1 3-3 1-2 4 2 2-1 3 3 3 3-1 2 3 4-1 1-3 3-1 1-4-2-2 1-3-3-3-3 1-2-3Z"/></svg></button>
    <button class="icon-button assistant-toggle" aria-label="收起助理" title="收起助理"><svg><use href="#i-panel"/></svg></button>
  </header>
  <main class="app-shell" id="shell">
    <nav id="chat-sidebar" class="chat-sidebar" aria-label="本学期对话">
      <div class="chat-sidebar-heading"><strong>对话</strong><button id="hide-chat-sidebar" class="icon-button" aria-label="收起对话侧栏"><svg><use href="#i-panel"/></svg></button></div>
      <button id="new-chat" class="button subtle"><svg><use href="#i-plus"/></svg>新建对话</button>
      <input id="history-search" class="picker-input" type="search" aria-label="搜索本学期聊天记录" placeholder="搜索对话…">
      <select id="history-filter" aria-label="筛选对话"><option value="open">近期对话</option><option value="archived">已归档</option></select>
      <div id="history-results" class="history-results"></div>
    </nav>
    <section class="workspace" aria-label="学习桌面">
      <nav class="workspace-tabs" aria-label="桌面与打开的文件">
        <button id="back" class="desk-tab active">桌面</button>
        <div class="document-tabs" id="document-tabs"></div>
        <div id="file-actions" hidden><div id="reader-modes" role="group" aria-label="Markdown 显示方式" hidden><button data-mode="preview">预览</button><button data-mode="source">源码</button></div><button id="edit-file" class="text-button" hidden>编辑</button><a id="download-file" class="text-button" download>下载</a><button id="history-file" class="text-button" hidden>历史</button><button id="transcribe-file" class="text-button" hidden>转写</button><span id="transcribe-status" hidden></span><button id="compile-file" class="text-button" hidden>编译 PDF</button><button id="view-pdf" class="text-button" hidden>PDF</button><button id="compare" class="icon-button" aria-label="并排查看" title="并排查看"> <svg><use href="#i-split"/></svg></button><button id="rename" class="icon-button" aria-label="重命名当前文件" title="重命名"><svg><use href="#i-rename"/></svg></button></div>
      </nav>
      <div id="desktop">
        <section class="files-panel" aria-label="课程文件">
        <div class="folder-toolbar"><button id="clear-folder" class="text-button" hidden><svg><use href="#i-back"/></svg>上一级</button><span id="files-heading"></span><button id="file-trash" class="text-button" hidden>已移除</button><button id="new-folder" class="icon-button" aria-label="新建文件夹" title="新建文件夹"><svg><use href="#i-plus"/></svg></button><button id="add-files" class="button subtle" hidden>添加文件</button><input id="file-input" type="file" multiple hidden></div>
        <div class="file-search"><input id="file-search" type="search" aria-label="搜索本学期文件" placeholder="搜索本学期的文件或文件夹…"><button id="clear-file-search" class="text-button" hidden>清除</button></div>
        <div id="folders" class="folders" aria-label="文件夹"></div>

        <div class="selection-bar" id="selection-bar" hidden><span id="selection-count"></span><button class="text-button" id="move-files">移动到文件夹</button><button class="text-button" id="move-first">放到最前</button><button class="text-button" id="remove-files">移除</button><button class="text-button" id="clear-selection">取消选择</button></div>
        <div id="inbox-heading" class="inbox-heading" hidden><span>待整理</span><small>新文件先放这里，再请助理归类</small></div>
        <div class="file-grid" id="files"></div>
        <div class="empty-state" id="empty" hidden><svg><use href="#i-file"/></svg><h3>这里还没有文件</h3><p>添加文件，或拖入材料。</p></div>

        </section>
        <section id="task-list" class="task-list" aria-label="任务清单"><h2><span>任务清单 <small id="task-count"></small></span><button id="new-task" class="icon-button" aria-label="新建任务">＋</button></h2><div class="task-filters"><div id="task-period" class="segmented" role="group" aria-label="任务时间"><button data-period="today" class="active">今天</button><button data-period="next">接下来</button><button data-period="all">全部</button></div><select id="task-course" aria-label="按课程筛选任务"><option value="">全部课程</option></select></div><div id="tasks"></div></section>
      </div>
      <div id="task" hidden>
        <div class="document-heading"><h1 id="document-title" class="sr-only"></h1><p id="document-meta"></p></div>
        <div class="document-area" id="document-area"></div>
        <div class="quote-bar" id="quote-bar" hidden><span id="quote-preview"></span><button class="button primary" id="ask-selection">问助理<svg><use href="#i-arrow"/></svg></button></div>
      </div>
    </section>
    <div class="panel-divider" id="divider" role="separator" aria-label="调整助理宽度" aria-orientation="vertical" tabindex="0" aria-valuemin="300" aria-valuemax="760" aria-valuenow="440"></div>
    <aside class="assistant" aria-label="学习助理">
      <div class="assistant-header"><button id="conversation-menu" class="icon-button" aria-label="展开对话侧栏" title="展开对话侧栏" aria-controls="chat-sidebar" aria-expanded="true"><svg><use href="#i-panel"/></svg></button><div class="assistant-identity"><span id="conversation-title">新对话</span></div><button id="expand-chat" class="icon-button" aria-label="展开对话" title="展开对话"><svg><use href="#i-split"/></svg></button><button id="find-chat" class="icon-button" aria-label="查找当前对话" title="查找当前对话（⌘/Ctrl F）"><svg><use href="#i-search"/></svg></button></div>
      <div id="chat-find" class="chat-find" hidden><input id="chat-find-input" type="search" aria-label="查找当前对话中的文字" placeholder="在这个对话中查找…"><span id="chat-find-count" role="status"></span><button id="chat-find-prev" class="text-button" aria-label="上一条匹配">↑</button><button id="chat-find-next" class="text-button" aria-label="下一条匹配">↓</button><button id="chat-find-close" class="text-button" aria-label="关闭对话查找">×</button></div>
      <p id="chat-unavailable" class="chat-unavailable" hidden>原文件已移除，仍可查看记录。请切换到桌面对话继续提问。</p>
      <div class="conversation-wrap"><div class="conversation" id="conversation" role="log" aria-label="对话记录" aria-live="polite"></div></div>
      <div class="assistant-bottom"><p id="model-setup" class="model-setup" hidden>使用助理前需要填写密钥。<button id="setup-assistant" class="text-button">设置助理</button></p><div class="composer"><div class="context-heading"><span>本次关联</span><button id="clear-context" class="text-button">清除</button></div><div id="contexts" class="contexts"></div><form id="chat-form"><textarea id="prompt" rows="1" aria-label="向助理提问" placeholder="说说你想做什么……"></textarea><div class="composer-footer"><button type="button" id="attach-context" class="icon-button" aria-label="关联桌面文件" title="关联桌面文件"><svg><use href="#i-plus"/></svg></button><button type="button" id="stop-agent" class="text-button" hidden>停止</button><button type="submit" class="send-button" aria-label="发送"><svg><use href="#i-send"/></svg></button></div></form></div><p class="prototype-note">正在连接服务…</p></div>
    </aside>
  </main>
  <button id="restore-assistant" class="restore-assistant" hidden>打开助理</button>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="picker"><form method="dialog"><div class="dialog-heading"><h2 id="picker-title">选择文件</h2><button class="icon-button" type="button" value="cancel" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div><div id="picker-body"></div><div class="dialog-actions"><button class="button subtle" type="button" value="cancel">取消</button><button class="button primary" id="picker-confirm" value="confirm">确定</button></div></form></dialog>
</body>
</html>
