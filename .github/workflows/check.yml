name: Cloud verification
on:
  push:
    branches: [main, 'codex/**']
    paths-ignore:
      - README.md
      - '.github/workflows/release.yml'
      - '.github/workflows/tooling.yml'
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - name: PDF dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep latexmk texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended texlive-science poppler-utils
      - run: ./study-agent setup
      - name: Browser dependencies
        run: pnpm exec playwright install --with-deps chromium
      - run: ./study-agent check
      - run: node verification/ui/check.cjs
      - run: node verification/ui/first-use.cjs
      - run: node verification/ui/state.cjs
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t study-agent:check .
      - run: docker run --rm study-agent:check python3 study-agent doctor
      - run: docker run --rm study-agent:check python3 packages/agent/tests/profile_loop.py
      - run: STUDY_CHECK_IMAGE=study-agent:check python3 verification/deployment/check.py
  native-device-checks:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s verification/transcription -p test_device.py -q
      - name: Textbook PDF extraction dependencies
        run: python -m pip install pypdfium2==4.30.0 Pillow==11.3.0 tzdata==2025.2
      - name: Learning backups and pure data handlers
        env:
          PYTHONPATH: packages/learning/src
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s packages/learning/tests -t packages/learning -v
          python -m unittest discover -s packages/agent/tests -p test_flow_handler.py -v
          python -m unittest discover -s packages/agent/tests -p test_worker.py -v
      - name: Desktop UTF-8, file paths and recovery
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s verification/desktop -p test_*.py -v
      - name: Native textbook lookup and backup
        env:
          STUDY_NATIVE: '1'
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s packages/agent/tests -p test_textbooks.py -v
      - name: Chat state and saved settings
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s packages/agent/tests -p test_chat.py -v
