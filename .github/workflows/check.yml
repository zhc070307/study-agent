name: Cloud verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: PDF dependencies
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-xetex texlive-lang-chinese poppler-utils
      - run: ./study-agent setup
      - name: Browser dependencies
        run: pnpm exec playwright install --with-deps chromium
      - run: ./study-agent check
      - run: node verification/ui/check.cjs
