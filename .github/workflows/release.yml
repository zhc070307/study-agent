name: Publish tested installers
on:
  workflow_dispatch:
    inputs:
      installer_run:
        description: Successful Desktop installers run number
        required: true
      tag:
        description: Version tag matching that build (for example v0.1.2)
        required: true
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-tested-installers
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INSTALLER_RUN: ${{ inputs.installer_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.19.0
      - run: npm ci --prefix packages/desktop --ignore-scripts
      - name: Confirm both installers passed and match the version tag
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9]+', os.environ['INSTALLER_RUN'])
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-(?:alpha|beta)\.[0-9]+)?', os.environ['RELEASE_TAG'])
          PY
          gh api "repos/$GH_REPO/actions/runs/$INSTALLER_RUN" > run.json
          gh api "repos/$GH_REPO/actions/runs/$INSTALLER_RUN/jobs" > jobs.json
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > tag.json
          tag_type="$(python -c 'import json; print(json.load(open("tag.json"))["object"]["type"])')"
          if [ "$tag_type" = tag ]; then
            tag_sha="$(python -c 'import json; print(json.load(open("tag.json"))["object"]["sha"])')"
            gh api "repos/$GH_REPO/git/tags/$tag_sha" > annotated.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.load(open('run.json'))
          jobs = json.load(open('jobs.json'))['jobs']
          tag = json.load(open('annotated.json' if Path('annotated.json').exists() else 'tag.json'))['object']
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          assert run['path'] == '.github/workflows/desktop.yml'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert len(jobs) == 2 and all(job['conclusion'] == 'success' for job in jobs)
          assert tag['type'] == 'commit' and tag['sha'] == run['head_sha']
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('VERIFIED_SOURCE=' + run['head_sha'] + '\n')
          PY
      - name: Confirm packaged version
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/contents/packages/desktop/package.json?ref=$VERIFIED_SOURCE" > package.json.response
          python - <<'PY'
          import base64, json, os
          response = json.load(open('package.json.response'))
          package = json.loads(base64.b64decode(response['content']))
          version = package['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_VERSION=' + version + '\n')
          PY
      - name: Retrieve verified installers and update metadata
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.installer_run }}
          pattern: Study-Agent-*
          path: installers
          merge-multiple: true
      - name: Validate update checksums and preserve download names
        run: node scripts/prepare-release.cjs installers downloads "$RELEASE_VERSION"
      - name: Upload complete downloads before publishing
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          在下方 Assets 选择安装包：Windows 使用 `.exe`，Apple 芯片 Mac 使用 `.dmg`（macOS 14 或更新）。

          软件安装与更新会保留课程资料、学习记录和设置。旧版尚无更新入口时，请下载安装新版。
          `.zip`、`.yml` 与 `.blockmap` 供应用更新使用，无需手动打开；`Source code` 是源码。
          尚未正式签名的 Mac 测试版通过下载页面更新；正式签名后支持应用内重启安装。

          使用方法见[项目首页](https://github.com/zhc070307/study-agent#readme)。
          NOTES
          printf '\n安装包来自已通过安装检查的源码 `%s`。\n' "$VERIFIED_SOURCE" >> notes.md
          flags=(--prerelease=false)
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags=(--prerelease); fi
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("existing.json"))["isDraft"], "Refusing to modify a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" --title "Study Agent $RELEASE_VERSION" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" downloads/* --clobber
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          gh api "repos/$GH_REPO/releases/$release_id" > uploaded.json
          python - <<'PY'
          import json
          expected = json.load(open('manifest.json'))
          release = json.load(open('uploaded.json'))
          actual = {asset['name']: asset for asset in release['assets']}
          assert release['draft'] and actual.keys() == expected.keys()
          for name, info in expected.items():
              assert actual[name]['state'] == 'uploaded'
              assert actual[name]['size'] == info['size'] and actual[name]['digest'] == info['digest']
          PY
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}" --notes-file notes.md
          gh release view "$RELEASE_TAG" --json url --jq .url
