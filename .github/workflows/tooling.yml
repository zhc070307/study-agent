name: Build tool compatibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tooling.yml'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Confirm runtime versions
        shell: bash
        run: |
          set -euo pipefail
          node -e 'if (process.versions.node !== "24.19.0") process.exit(1); require("fs").writeFileSync("tool-runtime.txt", process.versions.node)'
          pnpm --version
          uv --version
          python --version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: node24-${{ matrix.os }}
          path: tool-runtime.txt
      - uses: actions/download-artifact@v8.0.2
        with:
          name: node24-${{ matrix.os }}
          path: retrieved
      - name: Confirm artifact compatibility
        shell: bash
        run: |
          set -euo pipefail
          cmp tool-runtime.txt retrieved/tool-runtime.txt
